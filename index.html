<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Hand Cricket | Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style> /* RESET */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", "Segoe UI", sans-serif;
      }
      
      /* BACKGROUND */
      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 20%, #ff9a9e, transparent 40%),
          radial-gradient(circle at 80% 30%, #fad0c4, transparent 40%),
          radial-gradient(circle at 50% 80%, #a18cd1, transparent 45%),
          linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        background-size: 200% 200%;
        animation: bgFlow 14s ease infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
      }
      
      @keyframes bgFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      /* CONTAINER */
      .container {
        width: 100%;
        max-width: 500px;
        padding: 38px;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(18px);
        box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      }
      
      /* TITLE */
      h1 {
        text-align: center;
        font-size: 34px;
        font-weight: 800;
        margin-bottom: 6px;
        letter-spacing: 2px;
        background: linear-gradient(
          90deg,
          #ff512f,
          #f09819,
          #ffe259,
          #12d8fa,
          #1fa2ff,
          #dd2476
        );
        background-size: 300% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textFlow 4s linear infinite;
      }
      
      @keyframes textFlow {
        0% { background-position: 0% center; }
        100% { background-position: 300% center; }
      }
      
      .subtitle {
        text-align: center;
        font-size: 14px;
        margin-bottom: 28px;
        opacity: 0.9;
      }
      
      /* FORM */
      .form-group {
        margin-bottom: 18px;
      }
      
      label {
        font-size: 13px;
        margin-bottom: 6px;
        display: block;
      }
      
      input, select {
        width: 100%;
        padding: 12px 15px;
        border-radius: 12px;
        border: none;
        outline: none;
        font-size: 14px;
      }
      
      input:focus, select:focus {
        box-shadow: 0 0 0 2px #12d8fa, 0 0 15px rgba(18,216,250,0.9);
      }
      
      small {
        font-size: 11px;
        color: #ffe9a7;
      }
      
      /* CONSENT */
      .consent {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        font-size: 12px;
      }
      
      .consent input {
        accent-color: #ffe259;
        transform: scale(1.2);
      }
      
      /* BUTTON */
      button {
        width: 100%;
        margin-top: 26px;
        padding: 15px;
        font-size: 18px;
        font-weight: 700;
        border-radius: 16px;
        border: none;
        cursor: pointer;
        background: linear-gradient(90deg, #ffe259, #ffa751, #ff512f);
        box-shadow: 0 12px 35px rgba(255,100,100,0.6);
      }
      
      button:disabled {
        background: #777;
        cursor: not-allowed;
      }
      
      /* FOOTER */
      .footer {
        margin-top: 20px;
        font-size: 11px;
        text-align: center;
        opacity: 0.75;
      }
      
      /* DARK MODE */
      body.dark {
        background: linear-gradient(135deg, #0f0c29, #000);
      }
      
      body.dark .container {
        background: rgba(0,0,0,0.65);
      }
      
      body.dark input,
      body.dark select {
        background: #111;
        color: #fff;
      }
      
      /* TOGGLE */
      .theme-toggle {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 10px;
      }
      
      .switch {
        position: relative;
        width: 42px;
        height: 22px;
      }
      
      .switch input {
        opacity: 0;
      }
      
      .slider {
        position: absolute;
        inset: 0;
        background: #ccc;
        border-radius: 20px;
      }
      
      .slider::before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background: white;
        border-radius: 50%;
      }
      
      input:checked + .slider {
        background: #12d8fa;
      }
      
      input:checked + .slider::before {
        transform: translateX(20px);
      }
      </style>
</head>

<body>

  <div class="container">

    <!-- Dark mode toggle -->
    <div class="theme-toggle">
      <span>🌙</span>
      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
    </div>

    <h1>🏏 AI Hand Cricket</h1>
    <p class="subtitle">Enter your details to start the game</p>

    <form id="registrationForm">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required>
      </div>

      <div class="form-group">
        <label>Roll Number</label>
        <input type="text" id="rollno" required>
      </div>

      <div class="form-group">
        <label>Branch</label>
        <select id="branch" required>
          <option value="">Select Branch</option>
          <option value="CSE">Computer Science and Engineering</option>
          <option value="ECE">Electronics and Communication Engineering</option>
          <option value="EEE">Electrical and Electronics Engineering</option>
          <option value="ME">Mechanical Engineering</option>
          <option value="CH">Chemical Engineering</option>
          <option value="MT">Metallurgical Engineering</option>
          <option value="BT">Biotechnology</option>
          <option value="CE">Civil Engineering</option>
        </select>
      </div>

      <div class="form-group">
        <label>Favorite Indian Cricketer</label>
        <input type="text" id="favCricketer" required>
      </div>

      <div class="form-group">
        <label>Mobile Number (for winners only)</label>
        <input type="tel" id="mobile" pattern="[0-9]{10}">
        <small>
          Mobile number will be used only to contact prize winners for certificate distribution.
        </small>
      </div>

      <div class="consent">
        <input type="checkbox" id="consent">
        <label for="consent">
          I consent to share my details for fest participation and winner communication only.
        </label>
      </div>

      <button type="submit" id="submitBtn" disabled>
        Proceed to Rules
      </button>

    </form>

    <p class="footer">
      Data collected is used only during the event.
    </p>

  </div>

  <script > // ================================
    // ELEMENT REFERENCES
    // ================================
    const form = document.getElementById("registrationForm");
    const submitBtn = document.getElementById("submitBtn");
    const consentCheckbox = document.getElementById("consent");
    const darkToggle = document.getElementById("darkToggle");
    
    // Input fields
    const nameInput = document.getElementById("name");
    const rollnoInput = document.getElementById("rollno");
    const branchInput = document.getElementById("branch");
    const favCricketerInput = document.getElementById("favCricketer");
    const mobileInput = document.getElementById("mobile");
    
    // ================================
    // CONSENT LOGIC
    // ================================
    submitBtn.disabled = true;
    
    consentCheckbox.addEventListener("change", () => {
      submitBtn.disabled = !consentCheckbox.checked;
    });
    
    // ================================
    // FORM SUBMISSION
    // ================================
    form.addEventListener("submit", function (event) {
      event.preventDefault();
    
      // Trimmed values
      const name = nameInput.value.trim();
      const rollno = rollnoInput.value.trim();
      const branch = branchInput.value;
      const favCricketer = favCricketerInput.value.trim();
      const mobile = mobileInput.value.trim();
    
      // ----------------
      // VALIDATION
      // ----------------
      if (!name || !rollno || !branch || !favCricketer) {
        alert("Please fill all required fields.");
        return;
      }
    
      if (mobile && !/^[0-9]{10}$/.test(mobile)) {
        alert("Mobile number must be 10 digits.");
        return;
      }
    
      if (!consentCheckbox.checked) {
        alert("Please provide consent to continue.");
        return;
      }
    
      // ----------------
      // SAVE PLAYER DATA
      // ----------------
      const playerData = {
        name: name,
        rollno: rollno,
        branch: branch,
        favCricketer: favCricketer,
        mobile: mobile,
        registeredAt: new Date().toISOString()
      };
    
      // Save current player
      localStorage.setItem("currentPlayer", JSON.stringify(playerData));
    
      // Optional: maintain list of all players
      let allPlayers = JSON.parse(localStorage.getItem("allPlayers")) || [];
      allPlayers.push(playerData);
      localStorage.setItem("allPlayers", JSON.stringify(allPlayers));
    
      // ----------------
      // SUCCESS + REDIRECT
      // ----------------
      alert("Registration successful! Redirecting to rules...");
      window.location.href = "2.html";
    });
    
    // ================================
    // DARK MODE LOGIC
    // ================================
    
    // Load saved theme on page load
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
      document.body.classList.add("dark");
      if (darkToggle) darkToggle.checked = true;
    }
    
    // Toggle dark mode
    if (darkToggle) {
      darkToggle.addEventListener("change", () => {
        if (darkToggle.checked) {
          document.body.classList.add("dark");
          localStorage.setItem("theme", "dark");
        } else {
          document.body.classList.remove("dark");
          localStorage.setItem("theme", "light");
        }
      });
    }
    </script>
</body>
</html>
