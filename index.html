<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Hand Cricket | Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --gold: #f5c842;
      --cyan: #00e5ff;
      --red: #ff3b5c;
      --bg: #07090f;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.09);
      --text: #e8e8e8;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    /* Animated background blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
      animation: drift 18s ease-in-out infinite;
    }
    .blob1 { width: 500px; height: 500px; background: var(--gold); top: -150px; left: -150px; animation-delay: 0s; }
    .blob2 { width: 400px; height: 400px; background: var(--cyan); bottom: -120px; right: -100px; animation-delay: -6s; }
    .blob3 { width: 300px; height: 300px; background: var(--red); top: 40%; right: 20%; animation-delay: -12s; }
    @keyframes drift {
      0%, 100% { transform: translate(0,0) scale(1); }
      33%       { transform: translate(30px,-40px) scale(1.07); }
      66%       { transform: translate(-20px,30px) scale(0.95); }
    }

    /* Grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }

    .page { position: relative; z-index: 1; width: 100%; max-width: 460px; padding: 20px; }

    /* Header */
    .header { text-align: center; margin-bottom: 36px; }
    .eyebrow {
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 10px;
      opacity: 0.75;
    }
    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(52px, 12vw, 80px);
      letter-spacing: 4px;
      line-height: 0.9;
      background: linear-gradient(135deg, var(--gold) 0%, #fff8d0 50%, var(--gold) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% center; } }
    .subtitle {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 32px 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.07);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.5;
    }

    /* Fields */
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 8px;
      font-weight: 500;
    }
    .field input,
    .field select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .field select option { background: #10141e; color: #fff; }
    .field input::placeholder { color: rgba(255,255,255,0.15); }
    .field input:focus,
    .field select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245,200,66,0.12);
    }
    .field input.valid { border-color: rgba(0,229,255,0.4); }

    /* Consent */
    .consent {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 24px 0 4px;
    }
    .consent input[type="checkbox"] {
      width: 18px; height: 18px; flex-shrink: 0;
      accent-color: var(--gold);
      margin-top: 1px;
      cursor: pointer;
    }
    .consent label {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      line-height: 1.6;
      cursor: pointer;
    }

    /* Button */
    .btn {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--gold) 0%, #f0a030 100%);
      color: #07090f;
      box-shadow: 0 8px 32px rgba(245,200,66,0.35);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(245,200,66,0.55);
    }
    .btn:disabled {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.2);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Step dots */
    .steps {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
    }
    .step-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.12);
    }
    .step-dot.active { background: var(--gold); box-shadow: 0 0 8px var(--gold); }

    /* Decorative cricket ball */
    .cricket-deco {
      position: fixed;
      bottom: -60px; right: -60px;
      width: 220px; height: 220px;
      border-radius: 50%;
      border: 1px solid rgba(245,200,66,0.08);
      pointer-events: none;
      z-index: 0;
    }
    .cricket-deco::after {
      content: '';
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      border: 1px solid rgba(245,200,66,0.05);
    }

    /* Entrance animation */
    .page { animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:none; } }
  </style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="cricket-deco"></div>

  <div class="page">
    <div class="header">
      <div class="eyebrow">🏏 Fest · AI Game</div>
      <div class="title">Hand<br>Cricket</div>
      <div class="subtitle">Register to Play</div>
    </div>

    <div class="card">
      <form id="regForm">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Your name" autocomplete="off" required>
        </div>

        <div class="field">
          <label>Roll Number</label>
          <input type="text" id="rollno" placeholder="e.g. 22B01A0512" autocomplete="off" required>
        </div>

        <div class="field">
          <label>Branch</label>
          <select id="branch" required>
            <option value="">Select your branch</option>
            <option value="CSE">Computer Science and Engineering</option>
            <option value="ECE">Electronics and Communication Engineering</option>
            <option value="EEE">Electrical and Electronics Engineering</option>
            <option value="ME">Mechanical Engineering</option>
            <option value="CH">Chemical Engineering</option>
            <option value="MT">Metallurgical Engineering</option>
            <option value="BT">Biotechnology</option>
            <option value="CE">Civil Engineering</option>
          </select>
        </div>

        <div class="consent">
          <input type="checkbox" id="consent">
          <label for="consent">I consent to share my details for fest participation. Data is used only during the event.</label>
        </div>

        <button class="btn" type="submit" id="submitBtn" disabled>
          Let's Play →
        </button>
      </form>
    </div>

    <div class="steps">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>
  </div>

  <script>
    const form      = document.getElementById("regForm");
    const submitBtn = document.getElementById("submitBtn");
    const consent   = document.getElementById("consent");
    const nameInput = document.getElementById("name");
    const rollInput = document.getElementById("rollno");
    const branch    = document.getElementById("branch");

    function checkValid() {
      submitBtn.disabled = !(
        nameInput.value.trim() &&
        rollInput.value.trim() &&
        branch.value &&
        consent.checked
      );
    }
    [nameInput, rollInput, branch, consent].forEach(el => el.addEventListener("input", checkValid));
    [nameInput, rollInput, branch, consent].forEach(el => el.addEventListener("change", checkValid));

    // Live validation glow
    nameInput.addEventListener("input", () => {
      nameInput.classList.toggle("valid", nameInput.value.trim().length > 1);
    });
    rollInput.addEventListener("input", () => {
      rollInput.classList.toggle("valid", rollInput.value.trim().length > 3);
    });

    form.addEventListener("submit", e => {
      e.preventDefault();
      const data = {
        name: nameInput.value.trim(),
        rollno: rollInput.value.trim(),
        branch: branch.value,
        registeredAt: new Date().toISOString()
      };
      localStorage.setItem("currentPlayer", JSON.stringify(data));
      let all = JSON.parse(localStorage.getItem("allPlayers")) || [];
      all.push(data);
      localStorage.setItem("allPlayers", JSON.stringify(all));

      submitBtn.textContent = "✓ Loading Rules...";
      submitBtn.disabled = true;
      setTimeout(() => { window.location.href = "2.html"; }, 600);
    });
  </script>
</body>
</html>
